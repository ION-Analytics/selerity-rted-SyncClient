### set log levels - for more verbose logging change 'info' to 'debug' ###

log4j.rootLogger=DEBUG, stdout

log4j.logger.org.hibernate=WARN
log4j.logger.com.selerity=DEBUG
log4j.logger.com.selerityfinancial=WARN
log4j.logger.com.selerityfinancial.hddp=WARN
log4j.logger.com.selerity.sync.client=INFO
